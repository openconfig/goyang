name: Go

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  go:
    uses: openconfig/common-ci/.github/workflows/go.yml@857df491097bf7b7260afb6661be1d616f67faa2
    permissions:
      contents: read
      packages: read
      # To report Github Actions status checks
      statuses: write

  linter:
    uses: openconfig/common-ci/.github/workflows/linter.yml@88a41b190576ebf6d51b5204c1056af2bda19036
    permissions:
      contents: read
      packages: read
      # To report Github Actions status checks
      statuses: write
